name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    name: Linux ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-remove shellcheck iproute2 iptables wireguard-tools dante-server iperf3
      - name: Install forwarding proxy without starting a default HTTP site
        run: |
          sudo bash -c 'source ./iptables_Forward.sh; install_proxy_dependencies; if systemctl is-active --quiet nginx.service; then exit 1; fi'
      - name: Pinned sing-box for beginner example verification
        run: |
          curl -fL --retry 3 https://github.com/SagerNet/sing-box/releases/download/v1.14.0/sing-box-1.14.0-linux-amd64.tar.gz -o /tmp/sing-box.tar.gz
          echo '2375de6999f4f56ab46b4fc5ddf26a6aba1d3e61a0f4e7ddec2f4690457d5f63  /tmp/sing-box.tar.gz' | sha256sum -c -
          mkdir /tmp/a2b-sing-box
          tar -xzf /tmp/sing-box.tar.gz -C /tmp/a2b-sing-box --strip-components=1
          sudo install -m 755 /tmp/a2b-sing-box/sing-box /usr/local/bin/sing-box
      - name: Syntax and lint
        run: |
          bash -n iptables_Forward.sh
          shellcheck -x iptables_Forward.sh tests/*.sh
          git diff --check
      - name: Unit checks
        run: bash tests/unit.sh
      - name: Real network and service tests
        run: sudo --preserve-env=CI bash tests/integration.sh
